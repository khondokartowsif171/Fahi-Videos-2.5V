name: fahi_videos_mobile
description: "Fahi-Videos Mobile Pro - CapCut-Style Video Editor & Google Flow AI Video Studio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_spinkit: ^5.2.1

  # State Management
  provider: ^6.1.2

  # Media & Video Processing
  video_player: ^2.9.2
  chewie: ^1.8.5
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.3

  # Networking & APIs
  http: ^1.2.2
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
