services:
  studio:
    image: aura-fahi-studio:${FAHI_REVISION:?release revision required}
    build:
      context: ..
      dockerfile: Dockerfile.studio
    container_name: aura-fahi-studio
    restart: unless-stopped
    env_file: /opt/fahi-studio-preview/studio.env
    volumes:
      - /opt/fahi-studio-preview/media:/media
    networks: [coolify]
    mem_limit: 1g
    cpus: 1.0
    security_opt: [no-new-privileges:true]
  worker:
    image: aura-fahi-studio:${FAHI_REVISION:?release revision required}
    command: [node, ops/managed-worker.cjs]
    container_name: aura-fahi-worker
    restart: unless-stopped
    env_file: /opt/fahi-studio-preview/studio.env
    volumes:
      - /opt/fahi-studio-preview/media:/media
    networks: [coolify]
    mem_limit: 768m
    cpus: 0.75
    security_opt: [no-new-privileges:true]
  gateway:
    image: aura-fahi-gateway:${FAHI_REVISION:?release revision required}
    build:
      context: ..
      dockerfile: ops/gateway/Dockerfile
    container_name: aura-fahi-gateway
    restart: unless-stopped
    env_file: /opt/fahi-studio-preview/gateway.env
    networks: [coolify]
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.aura-fahi.rule=Host(`client.auraajenticai.cloud`) && (PathPrefix(`/fahi-studio`) || PathPrefix(`/api/fahi`) || Path(`/fahi-preview`))
      - traefik.http.routers.aura-fahi.entrypoints=https
      - traefik.http.routers.aura-fahi.tls=true
      - traefik.http.routers.aura-fahi.tls.certresolver=letsencrypt
      - traefik.http.routers.aura-fahi.priority=200
      - traefik.http.services.aura-fahi.loadbalancer.server.port=3000
networks:
  coolify:
    external: true
