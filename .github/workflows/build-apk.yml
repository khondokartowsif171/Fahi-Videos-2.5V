name: Build & Release Fahi-vids APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup local.properties & assets
        run: |
          mkdir -p mobile/assets
          touch mobile/assets/.gitkeep
          echo "flutter.sdk=$FLUTTER_ROOT" > mobile/android/local.properties

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK (Release)
        working-directory: mobile
        run: flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fahi-vids-Pro-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
